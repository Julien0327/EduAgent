<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智教助手 EduMate</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/katex.min.css">
</head>
<body>
  <header class="header">
    <h1>智教助手 <span class="brand">EduMate</span></h1>
    <p class="subtitle">教学任务自动化智能体 —— 用一句话，完成出卷、批改与学情分析</p>
  </header>

  <main class="main">
    <section class="card">
      <h2>系统状态</h2>
      <div class="status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">正在连接后端…</span>
      </div>
      <pre id="status-json" class="status-json">…</pre>
    </section>

    <section class="card">
      <h2>AI 对话测试</h2>
      <textarea id="chat-input" class="chat-input" placeholder="请输入教学任务……"></textarea>
      <button id="chat-send" class="chat-send">发送</button>
      <div id="chat-status" class="chat-status muted"></div>
      <div id="chat-reply" class="chat-reply"></div>
    </section>

    <section class="card">
      <h2>Agent 任务</h2>
      <p class="muted">用一句话下达教学任务（如：请对《一元二次方程》做一次章节小测并生成学情报告），实时查看执行进度与产物。</p>
      <div class="task-form">
        <textarea id="task-input" class="task-input" placeholder="例如：请对《一元二次方程》做一次章节小测并生成学情报告"></textarea>
        <button id="task-submit" class="task-submit">提交任务</button>
      </div>
      <div id="task-status" class="task-status muted"></div>
      <ol id="task-timeline" class="task-timeline"></ol>
      <div id="task-artifacts" class="task-artifacts"></div>
    </section>

    <section class="card">
      <h2>产品介绍</h2>
      <p>面向教师的 AI 教学任务执行者：自然语言下达教学任务，Agent 自动编排文档工具，产出试卷、答题卡、学情报告等可直接使用的教学文档。</p>
      <p class="muted">已打通「自然语言 → Agent 编排 → 文档产物」全链路：出卷、答题卡、学情报告、教案均可预览与下载。</p>
    </section>
  </main>

  <!-- 产物预览弹窗 -->
  <div id="preview-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-head">
        <span id="preview-title" class="modal-title"></span>
        <button id="preview-close" class="modal-close" aria-label="关闭">×</button>
      </div>
      <iframe id="preview-frame" class="modal-frame" src="about:blank"></iframe>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
