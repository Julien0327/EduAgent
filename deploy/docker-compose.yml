# Phase 6 / S2-C：生产编排（仅回环端口，外部由 nginx 反代）
# 用法（仓库根执行）：docker compose -f deploy/docker-compose.yml up -d --build
# 前置：.env 已配置；data/db 放置线上演示库；data/models 为 BGE 缓存
services:
  web:
    image: edumate:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    pull_policy: never
    ports:
      - "127.0.0.1:8000:8000" # 只监听回环，公网入口走 nginx 443
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data/db:/app/data/db           # SQLite（线上为纯合成演示库）
      - ../data/outputs:/app/data/outputs # 任务产物
      - ../data/models:/app/data/models:ro # BGE 模型缓存（只读）
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
