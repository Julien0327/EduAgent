# EduMate 生产 nginx 模板（Phase 6 / S3）
# 放置：/etc/nginx/sites-available/edumate，软链到 sites-enabled
# 证书：certbot --nginx -d edumateaip.xyz 生成后路径如下

upstream edumate_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name edumateaip.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edumateaip.xyz;

    ssl_certificate     /etc/letsencrypt/live/edumateaip.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edumateaip.xyz/privkey.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://edumate_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（任务进度）与 MCP Streamable HTTP 需要长连接、关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
